[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectrade-openapi"
version = "1.0.0"
description = "OpenAPI and AsyncAPI specifications for the VecTrade API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "VecTrade", email = "api@vectrade.io" }]

[project.urls]
Homepage = "https://github.com/VecTrade-io/vectrade-openapi"
Documentation = "https://docs.vectrade.io/api-reference"
Repository = "https://github.com/VecTrade-io/vectrade-openapi"
Issues = "https://github.com/VecTrade-io/vectrade-openapi/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
